name: Publish NuGet

# Pushing a release branch publishes the package. The branch pattern matches the
# publicReleaseRefSpec in version.json, so Nerdbank.GitVersioning drops the -g<commit>
# suffix and the package carries a clean version.
on:
  push:
    branches:
      - release/production
      - release/production/**

permissions:
  contents: write
  id-token: write   # lets this job request a GitHub OIDC token for NuGet Trusted Publishing

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Nugets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning computes the patch from git height

      - name: Setup Build Environment
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Project Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build -c Release --no-restore

      - name: Verify Production Version
        run: |
          FILE=src/Glq.Cli/bin/Release/net10.0/ProductionVersion.json
          cat "$FILE"
          MESSAGE=$(jq -r '.commit.message' "$FILE")
          SHA=$(jq -r '.commit.sha' "$FILE")
          if [ -z "$MESSAGE" ] || [ "$MESSAGE" = "%s" ] || [ "$MESSAGE" = "unknown" ]; then
            echo "::error::commit.message is '$MESSAGE' - the git format escape is wrong on this platform."
            exit 1
          fi
          if [ -z "$SHA" ] || [ "$SHA" = "unknown" ]; then
            echo "::error::commit.sha is '$SHA' - git metadata did not reach the build."
            exit 1
          fi

      - name: Pack Project
        run: dotnet pack src/Glq.Cli/Glq.Cli.csproj -c Release

      - name: Read Version
        run: |
          PACKAGE=$(ls ./release/*.nupkg | head -1)
          VERSION=$(basename "$PACKAGE" .nupkg | sed 's/^grdev\.glq-cli\.//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing $PACKAGE as $VERSION"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; leaving it alone."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      # Trusted Publishing: exchanges this job's short-lived GitHub OIDC token for a NuGet.org
      # API key that's valid for one hour, so no long-lived NUGET_API_KEY secret to leak or
      # rotate. Requires a Trusted Publishing policy on nuget.org for this repo/workflow file -
      # see https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet
        run: >
          dotnet nuget push ./release/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
